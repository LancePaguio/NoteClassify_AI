<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteClassify-AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/home.css">
  <script src="https://kit.fontawesome.com/19aba0697a.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="page-container">
  <header>
    <h1>NoteClassify-AI</h1>
    <div class="userDropdown">
      <div class="userInfo">
        <i class="fa-solid fa-circle-user" style="font-size: 20px; margin-right: 5px;"></i>
        <span id="userEmail">Username</span>
        <i class="fa-solid fa-caret-down" style="margin-left: 5px;"></i>
      </div>
      <div class="dropdownMenu" id="dropdown_Menu">
        <button id="HelpBtn">Help</button>
        <button id="AboutBtn">About</button>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>
  </header>


  <main class="home-content">
    <div id="dropzone" class="dropzone">
      <p>Drop your file here</p>
      <small>Supports JPG, PNG, Markdown</small>
    </div>
  </main>
  <script src="../js/app.js"></script>
</body>
</html>
