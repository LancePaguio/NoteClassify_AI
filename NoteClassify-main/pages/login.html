<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>NoteClassify - Login</title>
  <link rel="stylesheet" href="../css/login.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    integrity="sha512-Kw9tZGhD1AQsC8emcTg+2dSFLY3Z9FCBf0qQqgwXJAtjD+bff6H2Cv1/7F2CW+nEvZ1mHTAa4GoyBhXLIdYQHQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>
<body>
  <div class="loginContainer">
    <div class="login">
      <h1 class="logo">NoteClassify-AI</h1>
      <p class="subtitle">Log in to continue</p>

      <form id="loginForm" class="authForm">
        <input type="email" id="loginEmail" placeholder="Enter your email" required />
		<div class="passwordWrapper">
		  <input type="password" id="loginPassword" placeholder="Enter password" required />
	      <span class="togglePassword" data-target="loginPassword"></span>
	  </div>

      <div class="rememberCheck">
          <input type="checkbox" id="rememberMe" />
          <label for="rememberMe">Remember me</label>
      </div>

      <p id="loginError" class="errorMsg"></p>

      <button type="submit" class="loginBtn">Login</button>

      </form>

      <div class="divider">or continue with:</div>
      <div class="socialLogins">
        <div class="authProviders">
          <button class="social google" id="googleLogin">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google logo" />
            Google
          </button>
          <button class="social microsoft">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Microsoft logo" />
            Microsoft
          </button>
        </div>
      </div>

      <div class="loginLinks">
        <a href="#">Can't login?</a>
        <a href="/pages/register.html">Create an account</a>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
