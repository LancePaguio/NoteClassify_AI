<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>NoteClassify-AI - Register</title>
  <link rel="stylesheet" href="../css/register.css" />
</head>
<body>
  <div class="registerContainer">
    <h1>NoteClassify-AI</h1>
    <p class="subheading">Create your account</p>
    <form id="registerForm">
      <label for="registerName">Username:</label>
      <input type="text" id="registerName" placeholder="Enter your name" required />
      <label for="registerEmail">Email:</label>
      <input type="email" id="registerEmail" placeholder="Enter your email" required />
      <label for="registerPassword">Password:</label>

	  <div class="passwordWrapper">
	    <input type="password" id="registerPassword" placeholder="Enter password" required />
	    <span class="togglePassword" data-target="registerPassword"></span>
	  </div>

	  <label for="registerConfirm">Confirm Password:</label>

	  <div class="passwordWrapper">
	    <input type="password" id="registerConfirm" placeholder="Confirm password" required />
	    <span class="togglePassword" data-target="registerConfirm"></span>
	  </div>


      <p id="registerError" class="errorMsg"></p>
      <button type="submit">Create Account</button>
    </form>
    <p class="form-footer">Already have an account? <a href="/pages/login.html">Login</a></p>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
